name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: touch dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Smoke test du site en ligne
        run: |
          set -e
          U=https://delbrique.github.io
          sleep 20
          curl -fsS --retry 5 --retry-delay 10 --retry-all-errors "$U/" -o index.html
          grep -q "<title>" index.html && grep -o "<title>.*</title>" index.html
          for a in $(grep -oE '/assets/[^"]+' index.html) /CV_BIYONG-VALENTIN-DELBRIQUE.pdf /favicon.svg; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --retry 3 "$U$a")
            echo "$code $a"; [ "$code" = 200 ]
          done
